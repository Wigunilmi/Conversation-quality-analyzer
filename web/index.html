<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CQA · Оценка качества диалогов</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2351AF3D'/%3E%3Cpath d='M9 17l4 4 10-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <meta name="theme-color" content="#0F5431" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- Apply saved theme / accessibility settings before first paint (no flash). -->
  <script>try { const p = JSON.parse(localStorage.getItem("cqa-prefs") || "{}"), d = document.documentElement; const dark = p.theme === "dark" || (p.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); d.dataset.theme = dark ? "dark" : "light"; for (const k of ["contrast", "cvd"]) if (p[k]) d.dataset[k] = "on"; if (p.zoom) d.style.setProperty("--zoom", p.zoom); } catch {}</script>
</head>
<body>
  <a class="skip" href="#app">Перейти к содержимому</a>
  <div class="shell">
    <aside class="side">
      <div class="logo"><div class="mark">QA</div><div>CQA<small>Conversation Quality Analytics</small></div></div>
      <nav class="nav" id="nav" aria-label="Разделы">
        <a href="#/list" data-r="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Диалоги</a>
        <a href="#/checklists" data-r="checklists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Чек-листы</a>
        <a href="#/appeals" data-r="appeals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 4-9 4-9-4 9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg>Апелляции<span class="count hidden" id="ap-count"></span></a>
      </nav>
      <div class="side-a11y" role="group" aria-labelledby="side-a11y-t">
        <div class="side-a11y-t" id="side-a11y-t">Режим доступности</div>
        <button class="pmini" data-profile="lowvision" aria-pressed="false" title="Крупный текст и высокий контраст"><span aria-hidden="true">👁</span>Слабое зрение</button>
        <button class="pmini" data-profile="colorblind" aria-pressed="false" title="Синий и оранжевый вместо зелёного и красного, значки"><span aria-hidden="true">🎨</span>Дальтонизм</button>
      </div>
      <div class="side-foot">
        <div class="seg theme-seg" role="radiogroup" aria-label="Тема оформления">
          <button data-theme-set="light" role="radio" aria-label="Светлая тема" title="Светлая тема">☀</button><button data-theme-set="dark" role="radio" aria-label="Тёмная тема" title="Тёмная тема">☾</button><button data-theme-set="auto" role="radio" aria-label="Тема как в системе" title="Как в системе">Авто</button>
        </div>
        <div class="model-badge"><span class="dot" id="model-dot"></span><span id="model">…</span></div>
        <div class="muted">Клавиши: <kbd>←</kbd> <kbd>→</kbd> соседний диалог, <kbd>/</kbd> поиск</div>
      </div>
    </aside>
    <main id="app" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
